[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seewhatisee"
version = "0.1.0"
description = "A desktop screen understanding assistant"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
    "openai>=1.40,<3",
]

[project.scripts]
seewhatisee = "seewhatisee.main:main"

[tool.setuptools.packages.find]
where = ["src"]
